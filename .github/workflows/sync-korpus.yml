name: Sync Korpus catalog

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Quantidade máxima de produtos para testar'
        required: false
        default: '2'
  # Ativaremos o agendamento automático depois do primeiro teste real.
  # schedule:
  #   - cron: '15 11 * * *'
  #   - cron: '15 20 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate Supabase server key
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node - <<'NODE'
          let key = process.env.SUPABASE_SERVICE_ROLE_KEY || '';
          key = key.trim();
          if ((key.startsWith('"') && key.endsWith('"')) || (key.startsWith("'") && key.endsWith("'"))) {
            key = key.slice(1, -1).trim();
          }
          if (!key) {
            console.error('Secret SUPABASE_SERVICE_ROLE_KEY ausente.');
            process.exit(2);
          }
          console.log('Tamanho da chave:', key.length);
          if (key.startsWith('sb_secret_')) {
            console.log('Tipo da chave: Supabase Secret Key (server-side).');
            process.exit(0);
          }
          const parts = key.split('.');
          if (parts.length === 3) {
            try {
              const payload = JSON.parse(Buffer.from(parts[1], 'base64url').toString('utf8'));
              console.log('JWT role detectada:', payload.role || '(sem role)');
              if (payload.role !== 'service_role') {
                console.error('A chave JWT não é service_role. Copie a chave service_role, não a anon.');
                process.exit(3);
              }
              process.exit(0);
            } catch (e) {
              console.error('A chave tem formato JWT, mas o payload não pôde ser lido.');
              process.exit(5);
            }
          }
          console.error('Formato de chave não reconhecido como Secret Key ou service_role JWT.');
          process.exit(4);
          NODE
      - run: npx playwright install --with-deps chromium
      - name: Sync Korpus
        env:
          KORPUS_BASE_URL: https://korpuslingerie.com.br
          SYNC_LIMIT: ${{ inputs.limit || '2' }}
          SUPABASE_URL: https://uqsvagvtqzacpnphwzkb.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: korpus-products
        run: npm run sync
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korpus-sync-data
          path: data/
          retention-days: 7
